# cargo-about's configuration for crates.txt (see README.md in this directory).
# In order of preference: a crate under "MIT OR Apache-2.0" is listed under MIT.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # Juntei's own license (LICENSE), and that of Yamato Security's crates such as ys-ntfs-parser:
    # the template leaves it out, and lists the upstream licenses those crates also carry.
    "RPL-1.5",
]
# Test-only crates are not part of Juntei.
ignore-dev-dependencies = true
