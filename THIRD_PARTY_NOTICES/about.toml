# cargo-about's configuration for crates.txt (see README.md in this directory).
# In order of preference: a crate under "MIT OR Apache-2.0" is listed under MIT.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Test-only crates are not part of Juntei.
ignore-dev-dependencies = true

# Juntei itself, whose license is LICENSE: the template leaves it out.
[juntei]
accepted = ["RPL-1.5"]
