[package]
name = "juntei"
version = "1.0.0"
repository = "https://github.com/Yamato-Security/juntei"
authors = ["Yamato Security @SecurityYamato"]
description = "Windows forensics artifact parser"
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.99"
include = ["src/**/*", "art/**/*", "LICENSE", "README.md", "CHANGELOG.md"]

# Every crates.io dependency has an explicit floor rather than "*": a wildcard accepts any future
# release, including a breaking one, on the next `cargo update`. The parsers are Yamato Security's
# own and follow their main branches: Cargo.lock records the commits used, and `cargo update`
# moves to the latest.
[dependencies]
# Amcache parsing and output: Yamato Security's ys-amcache-parser (Apache-2.0).
amcache-forensic = { package = "ys-amcache-parser", git = "https://github.com/Yamato-Security/ys-amcache-parser" }
bytesize = "2"
# The Observation trait gives the severity of an Amcache finding; the system-binary and
# staging-directory lists drive the Prefetch findings.
forensicnomicon = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1"
indicatif = "0.18"
# $MFT parsing: Yamato Security's ys-mft-parser, a fork of Omer Ben-Amram's mft crate
# (MIT / Apache-2.0), without its ys-mft-parser command.
mft = { package = "ys-mft-parser", git = "https://github.com/Yamato-Security/ys-mft-parser", default-features = false }
# Prefetch parsing: Yamato Security's ys-prefetch-parser, a fork of Samuel Garcés Marín's
# frnsc-prefetch crate (MIT).
frnsc-prefetch = { package = "ys-prefetch-parser", git = "https://github.com/Yamato-Security/ys-prefetch-parser" }
serde_json = "1"
# USN journal parsing: Yamato Security's ys-usn-journal-parser, a fork of sootmark-usn
# (MIT OR Apache-2.0); its `mft` feature seeds paths from the $MFT with the same ys-mft-parser as
# above.
usn = { package = "ys-usn-journal-parser", git = "https://github.com/Yamato-Security/ys-usn-journal-parser", features = ["mft"] }
# LNK parsing: Yamato Security's ys-lnk-parser, a fork of sootmark-shell (MIT OR Apache-2.0),
# with its code pages for links from non-Western systems.
shell = { package = "ys-lnk-parser", git = "https://github.com/Yamato-Security/ys-lnk-parser", features = ["codepages"] }
# Jump list parsing: Yamato Security's ys-jump-lists-parser (from sootmark-shell's jump list and
# compound file code, MIT OR Apache-2.0); it reads links with the same ys-lnk-parser as above.
jumplist = { package = "ys-jump-lists-parser", git = "https://github.com/Yamato-Security/ys-jump-lists-parser", features = ["codepages"] }
# ShimCache parsing: Yamato Security's ys-shimcache-parser, a fork of Security Ronin's
# shimcache-forensic (Apache-2.0): its own SYSTEM hive reader with transaction log replay, every
# control set, and the findings.
shimcache-forensic = { package = "ys-shimcache-parser", git = "https://github.com/Yamato-Security/ys-shimcache-parser" }
# The order of parse-srum's JSON columns, and parse-mft's JSON entries (as ys-mft-parser writes them).
serde = { version = "1", features = ["derive"] }
# SRUM parsing: Yamato Security's ys-srum-parser, a fork of Sootmark's ese and srum crates
# (MIT OR Apache-2.0).
# Until Yamato-Security/ys-srum-parser#9 (value states and bytes) is merged: its branch.
srum = { package = "ys-srum-parser", git = "https://github.com/Yamato-Security/ys-srum-parser", branch = "ys/value-states" }
termcolor = "1"
# Defender quarantine parsing: Yamato Security's ys-defender-history-parser, a fork of
# sootmark-defender (MIT OR Apache-2.0).
defender = { package = "ys-defender-history-parser", git = "https://github.com/Yamato-Security/ys-defender-history-parser" }

[dev-dependencies]
# The SYSTEM hive of test_files/shimcache/ is kept gzipped.
flate2 = "1"
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"
