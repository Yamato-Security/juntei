[package]
name = "juntei"
version = "1.1.0"
repository = "https://github.com/Yamato-Security/juntei"
authors = ["Yamato Security @SecurityYamato"]
description = "Windows forensics artifact parser"
license = "RPL-1.5"
edition = "2024"
rust-version = "1.99"
build = "build.rs"
include = ["src/**/*", "art/**/*", "build.rs", "LICENSE", "THIRD_PARTY_NOTICES/**/*", "README.md", "CHANGELOG.md"]

# The Windows file properties (Details tab) of juntei.exe, embedded by build.rs. FileVersion and
# ProductVersion are the version above. The release workflow checks every value in the executable.
[package.metadata.winresource]
ProductName = "Juntei"
FileDescription = "Juntei - Windows Forensics Artifact Parser"
CompanyName = "Yamato Security"
InternalName = "juntei"
OriginalFilename = "juntei.exe"
LegalCopyright = "Copyright (C) 2026 Shirofune Security Co., Ltd."
Comments = "Windows artifact parsing for digital forensics and incident response"

# Compiles the Windows file properties into juntei.exe (build.rs); unused for other targets.
[build-dependencies]
winresource = "0.1.34"

# Every crates.io dependency has an explicit floor rather than "*": a wildcard accepts any future
# release, including a breaking one, on the next `cargo update`. The parsers are Yamato Security's
# own and follow their main branches: Cargo.lock records the commits used, and `cargo update`
# moves to the latest.
[dependencies]
# Amcache parsing and output: Yamato Security's ys-amcache-parser (Apache-2.0).
amcache-forensic = { package = "ys-amcache-parser", git = "https://github.com/Yamato-Security/ys-amcache-parser" }
bytesize = "2"
# The Observation trait gives the severity of an Amcache finding; the system-binary and
# staging-directory lists drive the Prefetch findings.
forensicnomicon = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1"
indicatif = "0.18"
# NTFS parsing ($MFT and $I30 indexes, the USN change journal, $LogFile, $Boot, $Secure:$SDS):
# Yamato Security's ys-ntfs-parser, whose mft, usn and logfile crates are forks of Omer Ben-Amram's
# mft, sootmark-usn and sootmark-ntfslog (MIT OR Apache-2.0), and whose boot and secure crates are
# its own, without its ys-ntfs-parser command. Keep every artifact on the main-branch workspace
# (including its shared byte/text/time helpers). Cargo.lock records the exact commit used by
# locked builds; cargo update advances it.
ys-ntfs-parser = { git = "https://github.com/Yamato-Security/ys-ntfs-parser", branch = "main", default-features = false }
# Prefetch parsing: Yamato Security's ys-prefetch-parser, a fork of Samuel Garcés Marín's
# frnsc-prefetch crate (MIT).
frnsc-prefetch = { package = "ys-prefetch-parser", git = "https://github.com/Yamato-Security/ys-prefetch-parser" }
# Preserve field order and exact float values when auto-parse rewrites generated JSON.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# Refuse to overwrite an input through the same path, a symlink or a hard link.
same-file = "1"
# parse-registry's filters on key paths, value names and data.
regex = "1"
# A command-local pool shares immutable evidence across persistence checks and
# bounds nested metadata/timeline work to the same --threads budget.
rayon = "1.12"
# Native persistence hunting: stream file hashes, parse bounded task XML and
# YAML profiles, and inspect embedded PE certificate metadata without a runtime.
sha2 = "0.10"
quick-xml = "0.38"
serde_yaml_ng = "0.10"
cms = "0.2"
x509-cert = "0.2"
der = { version = "0.7", features = ["alloc", "std"] }
evtx = { version = "0.12.3", default-features = false }
goblin = "0.10"
sha1 = "0.10"
# LNK parsing: Yamato Security's ys-lnk-parser, a fork of sootmark-shell (MIT OR Apache-2.0),
# with its code pages for links from non-Western systems.
shell = { package = "ys-lnk-parser", git = "https://github.com/Yamato-Security/ys-lnk-parser", features = ["codepages"] }
# Jump list parsing: Yamato Security's ys-jump-lists-parser (from sootmark-shell's jump list and
# compound file code, MIT OR Apache-2.0); it reads links with the same ys-lnk-parser as above.
jumplist = { package = "ys-jump-lists-parser", git = "https://github.com/Yamato-Security/ys-jump-lists-parser", features = ["codepages"] }
# ShimCache parsing: Yamato Security's ys-shimcache-parser, a fork of Security Ronin's
# shimcache-forensic (Apache-2.0): its own SYSTEM hive reader with transaction log replay, every
# control set, and the findings.
shimcache-forensic = { package = "ys-shimcache-parser", git = "https://github.com/Yamato-Security/ys-shimcache-parser" }
# Registry hives for parse-registry: Yamato Security's ys-registry-parser (Apache-2.0): keys and
# values, transaction log replay, deleted keys and values, registry autostart locations, UserAssist,
# BAM, installed software, MuiCache, Open/Save MRU, ShellBags and USB.
registry = { package = "ys-registry-parser", git = "https://github.com/Yamato-Security/ys-registry-parser" }
# The order of parse-ese srum's JSON columns, and parse-ntfs mft's JSON entries (as ys-ntfs-parser's command writes them).
serde = { version = "1", features = ["derive"] }
# SRUM parsing: Yamato Security's ys-srum-parser, a fork of Sootmark's ese and srum crates
# (MIT OR Apache-2.0).
srum = { package = "ys-srum-parser", git = "https://github.com/Yamato-Security/ys-srum-parser" }
# User Access Logging parsing: the ESE reader of ys-srum-parser (the fork of Sootmark's ese crate).
ese = { package = "ys-srum-parser-ese", git = "https://github.com/Yamato-Security/ys-srum-parser" }
# Browser history, downloads, cookies and form history: Yamato Security's ys-browser-parser, a
# fork of Sootmark's browser, sqlite and plist crates (MIT OR Apache-2.0); its timestamps are
# sootmark-common's.
browser = { package = "ys-browser-parser", git = "https://github.com/Yamato-Security/ys-browser-parser" }
# Use the same reader for detection: the committed schema may exist only in the WAL.
browser-sqlite = { package = "ys-browser-parser-sqlite", git = "https://github.com/Yamato-Security/ys-browser-parser" }
common = { package = "sootmark-common", version = "0.3.7" }
termcolor = "1"
# Defender quarantine parsing: Yamato Security's ys-defender-history-parser, a fork of
# sootmark-defender (MIT OR Apache-2.0).
defender = { package = "ys-defender-history-parser", git = "https://github.com/Yamato-Security/ys-defender-history-parser" }
# Outlook PST and OST stores and MSG and OFT files: Yamato Security's ys-outlook-parser, whose PST
# and compressed RTF readers are a fork of Microsoft's outlook-pst-rs (MIT). Named outlook-parser
# here so that its library does not clash with parse-file outlook's module.
outlook-parser = { package = "ys-outlook-parser", git = "https://github.com/Yamato-Security/ys-outlook-parser" }

# Native read-only VHDX/NTFS access on Linux, macOS and Windows. The separate
# OS-visible mount command uses the SDK's Linux-only FUSE adapter.
vhdx_mount = { package = "ys-vhdx-mount", git = "https://github.com/Yamato-Security/ys-vhdx-parser", branch = "main" }
tempfile = "3"
ewf_image = { package = "ys-e01-parser", git = "https://github.com/Yamato-Security/ys-e01-parser", branch = "main" }
ctrlc = "3.5"

[dev-dependencies]
# Build synthetic Outlook files for end-to-end export regressions.
cfb = "0.16"
# The SYSTEM hive of test_files/shimcache/ is kept gzipped.
flate2 = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"
